apiVersion: v1
kind: ServiceAccount
metadata:
  name: replication-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: replication-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["organization-token"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: replication-bootstrap
subjects:
  - kind: ServiceAccount
    name: replication-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: replication-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: replication-demo-login
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-admin-password"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: replication-demo-login
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: replication-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: replication-demo-login
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: replication-bootstrap
data:
  config.json: |
    {{ .Values | toJson }}
  replicate.mjs: |
{{ .Files.Get "files/replicate.mjs" | indent 4 }}
  create-demo-login.mjs: |
{{ .Files.Get "files/create-demo-login.mjs" | indent 4 }}
  replication.mjs: |
{{ .Files.Get "files/replication.mjs" | indent 4 }}
