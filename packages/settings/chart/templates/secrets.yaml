{{- $existing := lookup "v1" "Secret" .Release.Namespace "replication-encryption" -}}
{{- $credentials := lookup "v1" "Secret" .Release.Namespace "replication-credentials" -}}
{{- $adminPassword := .Values.adminPassword -}}
{{- if not $adminPassword -}}
{{- if $credentials -}}
{{- $adminPassword = index $credentials.data "REGISTRY_ADMIN_PASSWORD" | b64dec -}}
{{- else -}}
{{- $adminPassword = printf "%s!@" (randAlphaNum 32) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: replication-encryption
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  encryption-key: {{ if $existing }}{{ index $existing.data "encryption-key" | quote }}{{ else }}{{ randBytes 32 | b64enc | quote }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: replication-credentials
type: Opaque
stringData:
  REGISTRY_ADMIN_USERNAME: {{ required "Supply admin_username in uds-config.yaml" .Values.adminUsername | quote }}
  REGISTRY_ADMIN_PASSWORD: {{ $adminPassword | quote }}
  SOURCE_USERNAME: {{ required "Supply source_username in uds-config.yaml" .Values.sourceUsername | quote }}
  SOURCE_PASSWORD: {{ required "Supply source_password in uds-config.yaml" .Values.sourcePassword | quote }}
