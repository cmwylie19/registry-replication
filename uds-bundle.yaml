kind: UDSBundle
metadata:
  name: registry-replication
  description: Complete k3d, Zarf, UDS Core, Registry and automatic pull replication demo
  version: 0.1.0
packages:
  - name: demo-preflight
    path: build
    ref: 0.1.0
    exports:
      - name: CLUSTER_NAME
  - name: uds-k3d-dev
    repository: ghcr.io/defenseunicorns/packages/uds-k3d
    ref: 0.20.2-airgap
    imports:
      - name: CLUSTER_NAME
        package: demo-preflight
  - name: init
    repository: ghcr.io/zarf-dev/packages/init
    ref: v0.83.0
    keylessVerification:
      certificateIdentityRegexp: "https://github\\.com/zarf-dev/zarf/\\.github/workflows/release\\.yml@refs/tags/v\\d+\\.\\d+\\.\\d+"
      certificateOIDCIssuer: https://token.actions.githubusercontent.com
  - name: core-base
    repository: ghcr.io/defenseunicorns/packages/uds/core-base
    ref: 1.8.0-upstream
  - name: core-identity-authorization
    repository: ghcr.io/defenseunicorns/packages/uds/core-identity-authorization
    ref: 1.8.0-upstream
    overrides:
      keycloak:
        keycloak:
          values:
            - path: insecureAdminPasswordGeneration.enabled
              value: true
            - path: realmAuthFlows.OTP_ENABLED
              value: false
            - path: realmInitEnv.EMAIL_VERIFICATION_ENABLED
              value: false
            - path: realmInitEnv.TERMS_AND_CONDITIONS_ENABLED
              value: false
  - name: replication-settings
    path: build
    ref: 0.1.0
    overrides:
      replication-settings:
        replication-settings:
          variables:
            - name: ADMIN_USERNAME
              path: adminUsername
              default: doug
            - name: ADMIN_PASSWORD
              path: adminPassword
              sensitive: true
              default: ""
            - name: SOURCE_USERNAME
              path: sourceUsername
              sensitive: true
            - name: SOURCE_PASSWORD
              path: sourcePassword
              sensitive: true
  - name: postgres-operator
    repository: ghcr.io/uds-packages/postgres-operator
    ref: 1.15.1-uds.4-upstream
    overrides:
      postgres-operator:
        uds-postgres-config:
          values:
            - path: postgresql
              value:
                enabled: true
                teamId: uds
                volume:
                  size: 10Gi
                numberOfInstances: 2
                users:
                  uds-system.registry: []
                databases:
                  registrydb: uds-system.registry
                version: "14"
                ingress:
                  - remoteNamespace: uds-system
  - name: uds-registry
    path: ../../build
    ref: 0.0.0-dev-unicorn
    overrides:
      uds-registry:
        uds-registry:
          values:
            - path: additionalNetworkAllow
              value:
                - direction: Egress
                  selector:
                    app: replication-bootstrap
                  remoteGenerated: Anywhere
            - path: registry.auth.access.admins
              value: [doug@uds.dev]
            - path: registry.features.servePrivate
              value: true
            - path: registry.features.riverUi
              value: true
            - path: registry.features.pullReplication
              value: true
            - path: registry.features.connectApi
              value: true
            - path: registry.scanner.enabled
              value: true
            - path: secret.encryptionKey.secretRef
              value:
                name: replication-encryption
                key: encryption-key
            - path: database
              value:
                type: postgres
                connection:
                  secret:
                    name: uds-system.registry.pg-cluster.credentials.postgresql.acid.zalan.do
                    usernameKey: username
                    passwordKey: password
                  host: pg-cluster.postgres.svc.cluster.local
                  port: "5432"
                  name: registrydb
                  sslmode: require
  - name: replication-bootstrap
    path: build
    ref: 0.1.0
    timeout: 1h5m
